<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Routine Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      min-width: 300px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f5f5f5;
    }
    .task-done {
      text-decoration: line-through;
      color: gray;
    }
    ul {
      padding-left: 0;
      list-style: none;
    }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
    }
    .todo-item span {
      flex-grow: 1;
    }
    .deleteBtn {
      background: none;
      border: none;
      cursor: pointer;
      color: red;
    }
  </style>
</head>
<body>
  <h1>🗓️ Daily Routine Tracker</h1>
  <label for="daySelect">Select Day: </label>
  <select id="daySelect"></select>

 
  <h2>📝 To-Do List</h2>
  <form id="todoForm">
    <input type="text" id="todoInput" placeholder="Add a task..." required />
    <button type="submit">Add</button>
  </form>
  <ul id="todoList"></ul>
  <hr>

  <h2>Today's Routine</h2>
  <table id="routineTable"></table>



  <script src="popup.js"></script>
</body>
</html>
