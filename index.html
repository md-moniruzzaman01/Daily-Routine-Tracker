<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Routine Tracker</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>📝 Custom Routine</h1>

    <!-- Button to show the routine form -->
    <button id="addRoutineBtn">Add Routine</button>

    <!-- Routine Form and Buttons -->
    <div id="routineFormContainer">
        <form id="customRoutineForm">
            <label for="daySelect">Select Days: </label>
            <select id="daySelect" multiple>
                <!-- Days will be dynamically added -->
            </select><br><br>

            <input type="time" id="customTime" required />
            <input type="text" id="customActivity" placeholder="Enter activity" required />
            <button type="submit">Add Routine</button>
        </form>

        <button id="closeBtn">Close</button>
    </div>

 <div>
    <h3>Daily Routine for <span id="selectedDay"></span></h3>
    <input type="checkbox" name="hideChecked" id="hideCheckedBtn">
 </div>

    <table id="customRoutineTable">
        <tr>
            <th>Time</th>
            <th>Activity</th>
            <th>Actions</th>
            <th>Complete</th>
        </tr>
    </table>
    <script src="ui.js"></script>
    <script src="popup.js"></script>
</body>
</html>
